name: Build and Push Docker Image
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "**@[0-9]*.[0-9]*.[0-9]*"

jobs:
  build-push-container-images:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v5.0.0
        with:
          fetch-depth: 0 # Fetch all history for git commands to work properly not 1(default only latest commit)
      - name: Install task
        uses: ./.github/actions/setup-dependencies
      - name: Authenticate to Docker Hub
        if: ${{ !env.ACT }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # - name: Set Up QEMU
      #   uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 #3.7.0
      # - name: Set up Docker Buildx
      #   uses: docker/setup-buildx-action@v3
      - name: Compute image tag
        id: image-tag
        working-directory: .
        env:
          ENVIRONMENT: staging
          PROJECT_NAME: lama-backend
        run: |
          if [[ "$ENVIRONMENT" == "production" ]]; then
            version=$(task utils:generate-version -- "$PROJECT_NAME")
            image_tag=$(task utils:generate-version-tag -- "$PROJECT_NAME" )
          else
            version=$(task utils:generate-extended-version -- "$PROJECT_NAME")
            image_tag=$(task utils:generate-extended-version-tag -- "$PROJECT_NAME" )
          fi
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "image_tag=${image_tag}" >> $GITHUB_OUTPUT

          echo "version=${version}"
          echo "image_tag=${image_tag}"
