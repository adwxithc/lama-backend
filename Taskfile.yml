version: '3'

vars:
  IMAGE_REPO: "adwaithc/lama-backend"
  IMAGE_TAG: "foobarbaz" # this will be overridden by the generate-version-tag task in CI
  SERVICE_RELEASE_TAG: "lama-backend"

includes:
  utils: ./utils/Taskfile.yml

tasks:
  build-container-image:
    desc: "Build the container image"
    cmds:
      - docker build -t {{.IMAGE_REPO}}{{.IMAGE_TAG}} .
  build-container-image-multi-arch:
    desc: "Build the container image for multiple architectures"
    cmds:
      - |
        docker buildx build \
        --platform linux/amd64,linux/arm64 \
        -t {{.IMAGE_REPO}}:{{.IMAGE_TAG}} \
        --push \
        .
  install:
    desc: "Install dependencies"
    cmds:
      - npm install
  install-ci: # this is used in CI to install dependencies without modifying package-lock.json and Deletes node_modules before installing
    desc: "Install dependencies for CI"
    cmds:
      - npm ci

  build:
    desc: "Build the application"
    cmds:
      - npm run build

  test:
    desc: "Run tests"
    cmds:
      - npm test
  run:
    desc: "Start the application"
    cmds:
      - npm run dev